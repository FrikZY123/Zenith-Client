name: Build Zenith Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'icon.svg'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'resource-pack/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon.svg www/

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/java/com/zenith/client
          cat > android/app/src/main/java/com/zenith/client/MinecraftLauncherPlugin.java <<'JAVA'
          package com.zenith.client;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.Settings;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "MinecraftLauncher")
          public class MinecraftLauncherPlugin extends Plugin {
              @PluginMethod
              public void launch(PluginCall call) {
                  if (!Settings.canDrawOverlays(getContext())) {
                      Intent settings = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getContext().getPackageName()));
                      settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(settings);
                      call.reject("Erlaube Zenith Client das Anzeigen über anderen Apps und tippe danach erneut auf Launch.");
                      return;
                  }
                  Intent game = getContext().getPackageManager().getLaunchIntentForPackage("com.mojang.minecraftpe");
                  if (game == null) { call.reject("Minecraft Bedrock ist nicht installiert."); return; }
                  getContext().startService(new Intent(getContext(), ZenithOverlayService.class));
                  game.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(game);
                  call.resolve();
              }
          }
          JAVA
          cat > android/app/src/main/java/com/zenith/client/ZenithOverlayService.java <<'JAVA'
          package com.zenith.client;
          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.PixelFormat;
          import android.os.IBinder;
          import android.view.Gravity;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class ZenithOverlayService extends Service {
              private WindowManager windowManager;
              private View launcherButton;
              private View menuPanel;
              private WindowManager.LayoutParams buttonParams;
              private WindowManager.LayoutParams menuParams;

              @Override public IBinder onBind(Intent intent) { return null; }

              @Override public void onCreate() {
                  super.onCreate();
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);

                  TextView button = new TextView(this);
                  button.setText("Z");
                  button.setTextColor(Color.rgb(255, 214, 45));
                  button.setTextSize(22);
                  button.setTypeface(Typeface.DEFAULT, Typeface.BOLD_ITALIC);
                  button.setGravity(Gravity.CENTER);
                  button.setBackgroundColor(Color.rgb(34, 29, 58));
                  button.setElevation(10f);
                  button.setOnClickListener(v -> toggleMenu());
                  launcherButton = button;

                  buttonParams = new WindowManager.LayoutParams(
                      dp(54), dp(54), WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT);
                  buttonParams.gravity = Gravity.TOP | Gravity.END;
                  buttonParams.x = dp(16);
                  buttonParams.y = dp(180);
                  windowManager.addView(launcherButton, buttonParams);
                  menuPanel = createMenu();
                  menuPanel.setVisibility(View.GONE);
                  menuParams = new WindowManager.LayoutParams(
                      dp(220), WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT);
                  menuParams.gravity = Gravity.TOP | Gravity.END;
                  menuParams.x = dp(16);
                  menuParams.y = dp(240);
                  windowManager.addView(menuPanel, menuParams);
              }

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private View createMenu() {
                  LinearLayout panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(dp(14), dp(12), dp(14), dp(12));
                  panel.setBackgroundColor(Color.rgb(25, 23, 40));
                  panel.setElevation(12f);

                  TextView title = new TextView(this);
                  title.setText("ZENITH CLIENT");
                  title.setTextColor(Color.rgb(255, 214, 45));
                  title.setTextSize(16);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  panel.addView(title);

                  TextView test = new TextView(this);
                  test.setText("Test");
                  test.setTextColor(Color.WHITE);
                  test.setTextSize(18);
                  test.setPadding(0, dp(16), 0, dp(16));
                  panel.addView(test);

                  Button close = new Button(this);
                  close.setText("Schließen");
                  close.setOnClickListener(v -> toggleMenu());
                  panel.addView(close);
                  return panel;
              }

              private void toggleMenu() {
                  if (menuPanel == null) return;
                  menuPanel.setVisibility(menuPanel.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE);
              }

              @Override public void onDestroy() {
                  if (windowManager != null) {
                      if (menuPanel != null) try { windowManager.removeView(menuPanel); } catch (Exception ignored) { }
                      if (launcherButton != null) try { windowManager.removeView(launcherButton); } catch (Exception ignored) { }
                  }
                  super.onDestroy();
              }
          }
          JAVA
          cat > android/app/src/main/java/com/zenith/client/MainActivity.java <<'JAVA'
          package com.zenith.client;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MinecraftLauncherPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          if "<queries>" not in text:
              start = text.find("<manifest")
              end = text.find(">", start)
              if start < 0 or end < 0:
                  raise SystemExit("Android manifest root tag not found")
              text = text[:end + 1] + chr(10) + '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' + chr(10) + '    <queries>' + chr(10) + '        <package android:name="com.mojang.minecraftpe" />' + chr(10) + '    </queries>' + chr(10) + text[end + 1:]
              path.write_text(text)
          elif "SYSTEM_ALERT_WINDOW" not in text:
              text = text.replace("<queries>", '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' + chr(10) + '    <queries>', 1)
              path.write_text(text)
          service = '    <service android:name="com.zenith.client.ZenithOverlayService" android:exported="false" />'
          if "ZenithOverlayService" not in text:
              text = text.replace("</application>", service + chr(10) + "</application>", 1)
              path.write_text(text)
          PY
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "android/app/src/main/res/mipmap-${density}"
            convert -background none icon.svg -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            convert -background none icon.svg -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher_foreground.png"
          done


      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Audit APK permissions and package metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -n 8

      - name: Name the APK for users
        run: |
          mkdir -p dist
          cp "android/app/build/outputs/apk/debug/app-debug.apk" "dist/Zenith Client.apk"
          test -s "dist/Zenith Client.apk"
          ls -lh "dist/Zenith Client.apk"

      - name: Package Zenith title resource pack
        run: |
          mkdir -p dist
          (cd resource-pack && zip -r "../dist/Zenith-Title-Pack.mcpack" manifest.json ui)
          test -s "dist/Zenith-Title-Pack.mcpack"
          ls -lh "dist/Zenith-Title-Pack.mcpack"

      - name: Upload APK and title pack
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Client
          path: |
            dist/Zenith Client.apk
            dist/Zenith-Title-Pack.mcpack
          if-no-files-found: error
          retention-days: 14
