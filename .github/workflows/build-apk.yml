name: Build Zenith APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Install Capacitor dependencies
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" icon.svg -o "$dir/ic_launcher.png"
            rsvg-convert -w "$size" -h "$size" icon.svg -o "$dir/ic_launcher_round.png"
            rsvg-convert -w "$size" -h "$size" icon.svg -o "$dir/ic_launcher_foreground.png"
          done
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Inspect APK permissions
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          if [ -z "$AAPT" ]; then
            echo "aapt tool not found"
            exit 1
          fi
          "$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Client-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
