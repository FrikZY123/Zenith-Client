<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0c14">
<meta name="description" content="Zenith Client für Minecraft Bedrock">
<link rel="manifest" href="./manifest.json">
<title>Zenith Client</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0a0c14;color:#f4f1ff}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 20%,#292047 0,transparent 55%),#0a0c14;display:grid;place-items:center;padding:24px}
main{width:min(100%,360px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}
.logo{width:74px;height:74px;display:grid;place-items:center;border:1px solid #57477c;border-radius:20px;background:linear-gradient(145deg,#28203e,#151522);color:#d6c5ff;box-shadow:0 14px 55px #0005}
.logo svg{width:52px;height:52px}.brand{font-size:28px;font-weight:900;letter-spacing:.16em;margin:0}.subtitle{font-size:13px;color:#9f9ab8;margin:-12px 0 8px}
button{width:100%;min-height:62px;border:1px solid #d6c5ff;border-radius:14px;background:linear-gradient(135deg,#d7c8ff,#a995ed);color:#171224;font-size:16px;font-weight:900;letter-spacing:.12em;box-shadow:0 8px 28px #8d76d333;cursor:pointer}
button:active{transform:scale(.985)}button:disabled{opacity:.65;cursor:wait}
#feedback{font-size:13px;line-height:1.5;color:#c7c0df;min-height:20px;max-width:320px} .hidden{display:none}
</style>
</head>
<body>
<main>
<div class="logo" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M4 8H21V14H15V35H9V14H4Z" fill="currentColor"/><path d="M44 8H27V14H33V35H39V14H44Z" fill="currentColor"/></svg></div>
<h1 class="brand">ZENITH</h1>
<p class="subtitle">CLIENT · BEDROCK</p>
<button id="inject" type="button">INJECT</button>
<div id="feedback" role="status" aria-live="polite"></div>
</main>
<script>
const button=document.getElementById('inject');
const feedback=document.getElementById('feedback');
button.addEventListener('click',async()=>{
 const plugin=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.MinecraftLauncher;
 if(!plugin||!plugin.launch){feedback.textContent='INJECT funktioniert nur in der installierten Android-App.';return;}
 button.disabled=true;feedback.textContent='Zenith wird gestartet …';
 try{await plugin.launch();feedback.textContent='Overlay gestartet. Geh in deine Minecraft-Welt und tippe dort auf den schwebenden Z-Button. Das ist ein Overlay, keine echte Prozess-Injection.';}
 catch(error){feedback.textContent=(error&&error.message)?error.message:'Minecraft konnte nicht gestartet werden. Prüfe, ob Minecraft Bedrock installiert ist und erlaube Zenith das Anzeigen über anderen Apps.';}
 finally{button.disabled=false;}
});
</script>
<script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
</body>
</html>
